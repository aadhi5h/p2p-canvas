<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>P2P Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #020302;
      background-image:
        linear-gradient(#171A18 1px, transparent 1px),
        linear-gradient(90deg, #171A18 1px, transparent 1px);
      background-size: 40px 40px;
    }

    #app-canvas { display: block; width: 100vw; height: 100vh; position: relative; z-index: 1; }

    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; gap: 14px;
      padding: 12px 18px;
      background: #020302;
      border-bottom: 1px solid #171A18;
    }

    #topbar h1 {
      font-size: 13px; font-weight: 600; color: #DDE3DE; margin: 0;
      font-family: 'JetBrains Mono', monospace;
    }

    #offline-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 600; padding: 4px 10px;
      border: 1px solid #6B706C; color: #6B706C;
    }
    #offline-indicator.online {
      color: #00FF55; border-color: #00C853;
      box-shadow: 0 0 12px rgba(0, 255, 85, 0.25);
    }

    #peer-list { display: flex; gap: 6px; flex-wrap: wrap; }
    .peer-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; padding: 3px 8px;
      border: 1px solid #6B706C; color: #DDE3DE;
      display: flex; align-items: center; gap: 6px;
    }
    .peer-mark { width: 6px; height: 6px; flex-shrink: 0; }

    #spacer { flex: 1; }

    button.btn {
      font-family: 'Inter', sans-serif;
      font-size: 12px; font-weight: 600; padding: 7px 16px;
      border: 1px solid #00C853; background: transparent; color: #00FF55;
      cursor: pointer; transition: background 0.15s, box-shadow 0.15s;
    }
    button.btn:hover { background: rgba(0, 255, 85, 0.08); box-shadow: 0 0 10px rgba(0, 255, 85, 0.2); }

    button.btn-quiet {
      border-color: #6B706C; color: #6B706C;
    }
    button.btn-quiet:hover { background: rgba(221, 227, 222, 0.05); box-shadow: none; }

    #invite-modal, #devtools-panel {
      position: fixed; z-index: 30;
      background: #171A18; border: 1px solid #6B706C;
      padding: 18px;
      display: none;
    }

    #invite-modal { top: 66px; right: 18px; width: 340px; border-color: #00C853; }
    #invite-modal.open { display: block; }

    #invite-modal h2 {
      font-size: 13px; color: #DDE3DE; margin: 0 0 12px; font-weight: 600;
    }
    #invite-modal .step {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: #6B706C; margin: 12px 0 5px; letter-spacing: 0.2px;
    }
    #invite-modal textarea {
      width: 100%; height: 54px; font-size: 10px; font-family: 'JetBrains Mono', monospace;
      background: #020302; color: #DDE3DE; border: 1px solid #6B706C;
      padding: 7px; resize: none;
    }
    #invite-modal textarea:focus { outline: none; border-color: #00C853; }
    #invite-modal button.btn { margin-top: 7px; width: 100%; }
    #action-status {
      display: block; font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: #6B706C; margin-top: 10px; min-height: 14px;
    }

    #devtools-panel { bottom: 18px; left: 18px; width: 220px; border-color: #DFFF00; }
    #devtools-panel.open { display: block; }
    #devtools-panel h2 {
      font-size: 11px; color: #DFFF00; margin: 0 0 10px; font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }
    #webgpu-status { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; margin-bottom: 8px; }
    #webgpu-canvas { width: 100%; height: 100px; border: 1px solid #6B706C; }
    #devtools-panel .exp-row { display: flex; gap: 6px; margin-top: 8px; }
    #devtools-panel button {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; padding: 6px 8px; flex: 1;
      border: 1px solid #6B706C; background: transparent; color: #DDE3DE; cursor: pointer;
    }
    #devtools-panel button:hover { border-color: #DFFF00; color: #DFFF00; }

    #devtools-toggle {
      position: fixed; bottom: 18px; left: 18px; z-index: 25;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <h1>P2P_CANVAS</h1>
    <span id="offline-indicator"></span>
    <div id="peer-list"></div>
    <div id="spacer"></div>
    <button class="btn" id="btn-invite-toggle">Invite</button>
  </div>

  <div id="invite-modal">
    <h2>Connect a peer</h2>
    <div class="step">01 — create an offer, send it to the other tab</div>
    <button class="btn" id="btn-create-offer">Create offer</button>
    <textarea id="offer-out" placeholder="Offer will appear here" readonly></textarea>

    <div class="step">02 — paste a peer's offer to join them</div>
    <textarea id="offer-in" placeholder="Paste peer's offer here"></textarea>
    <button class="btn" id="btn-join">Join with offer</button>
    <textarea id="answer-out" placeholder="Answer will appear here" readonly></textarea>

    <div class="step">03 — paste their answer back to finish</div>
    <textarea id="answer-in" placeholder="Paste peer's answer here"></textarea>
    <button class="btn" id="btn-complete">Complete connection</button>

    <span id="action-status"></span>
  </div>

  <button class="btn btn-quiet" id="devtools-toggle">Dev tools</button>
  <div id="devtools-panel">
    <h2>WEBGPU // EXPERIMENTAL</h2>
    <span id="webgpu-status"></span>
    <canvas id="webgpu-canvas"></canvas>
    <div class="exp-row">
      <button id="btn-experiment-color">Set color</button>
      <button id="btn-experiment-move">Move</button>
    </div>
    <div class="exp-row">
      <button id="btn-force-collision-color">Force color</button>
      <button id="btn-force-collision-move">Force move</button>
    </div>
  </div>

  <canvas id="app-canvas"></canvas>
  <script type="module" src="/dist/main.js"></script>
  <script>
    document.getElementById("btn-invite-toggle").addEventListener("click", () => {
      document.getElementById("invite-modal").classList.toggle("open");
    });
    document.getElementById("devtools-toggle").addEventListener("click", () => {
      document.getElementById("devtools-panel").classList.toggle("open");
    });
  </script>
</body>
</html>
