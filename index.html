<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>P2P Canvas</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: system-ui, sans-serif; }
    #app-canvas { display: block; width: 100vw; height: 100vh; }
    #signaling-panel {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: #1a1a1a; color: #eee; padding: 10px; font-size: 12px;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    #signaling-panel textarea { width: 220px; height: 40px; font-size: 10px; }
    #signaling-panel button { cursor: pointer; }
    #peer-list { font-size: 11px; }
    #peer-list div { margin: 2px 0; }
  </style>
</head>
<body>
  <div id="signaling-panel">
    <button id="btn-create-offer">Add Peer: Create Offer</button>
    <textarea id="offer-out" placeholder="Offer appears here" readonly></textarea>
    <textarea id="offer-in" placeholder="Paste peer's offer here (to join)"></textarea>
    <button id="btn-join">Join With Offer</button>
    <textarea id="answer-out" placeholder="Answer appears here" readonly></textarea>
    <textarea id="answer-in" placeholder="Paste peer's answer here"></textarea>
    <button id="btn-complete">Complete Connection</button>
    <span id="action-status"></span>
    <div id="peer-list"></div>
  </div>
  <canvas id="app-canvas"></canvas>
  <script type="module" src="/dist/main.js"></script>
</body>
</html>
